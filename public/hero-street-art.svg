<svg viewBox="0 0 1580 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo simples degradado -->
  <rect width="1580" height="470" fill="url(#bgGrad)"/>

  <!-- Linha horizontal minimalista (rua) -->
  <line x1="0" y1="380" x2="1580" y2="380" stroke="#333333" stroke-width="1" opacity="0.5"/>

  <!-- Dois blocos de cor grandes e simples -->
  <rect x="0" y="0" width="750" height="470" fill="#0d0d1a" opacity="0.3"/>
  <rect x="830" y="0" width="750" height="470" fill="#1a1a2e" opacity="0.2"/>

  <!-- Um elemento geométrico minimalista -->
  <circle cx="1400" cy="100" r="120" fill="#00d9ff" opacity="0.08"/>
  <circle cx="180" cy="350" r="100" fill="#ff2d5a" opacity="0.06"/>
</svg>
