<svg viewBox="0 0 1580 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo degradado urbano -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="streetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Céu urbano -->
  <rect width="1580" height="470" fill="url(#skyGrad)"/>

  <!-- Prédios ao fundo (escuros) -->
  <rect x="0" y="180" width="280" height="290" fill="#0a0a14"/>
  <rect x="280" y="200" width="240" height="270" fill="#0d0d1a"/>
  <rect x="520" y="150" width="300" height="320" fill="#0a0a14"/>
  <rect x="820" y="180" width="260" height="290" fill="#0d0d1a"/>
  <rect x="1080" y="160" width="280" height="310" fill="#0a0a14"/>
  <rect x="1360" y="200" width="220" height="270" fill="#0d0d1a"/>

  <!-- Janelas nos prédios -->
  <g fill="#ffd700" opacity="0.15">
    <rect x="20" y="220" width="20" height="20"/>
    <rect x="50" y="220" width="20" height="20"/>
    <rect x="20" y="260" width="20" height="20"/>
    <rect x="50" y="260" width="20" height="20"/>
    <rect x="20" y="300" width="20" height="20"/>
    <rect x="50" y="300" width="20" height="20"/>
    <rect x="20" y="340" width="20" height="20"/>
    <rect x="50" y="340" width="20" height="20"/>
  </g>

  <!-- Mais janelas -->
  <g fill="#ffaa00" opacity="0.12">
    <rect x="310" y="250" width="18" height="18"/>
    <rect x="340" y="250" width="18" height="18"/>
    <rect x="310" y="290" width="18" height="18"/>
    <rect x="340" y="290" width="18" height="18"/>
    <rect x="310" y="330" width="18" height="18"/>
    <rect x="340" y="330" width="18" height="18"/>
  </g>

  <!-- Rua com perspectiva -->
  <rect x="0" y="380" width="1580" height="90" fill="url(#streetGrad)"/>
  <line x1="0" y1="380" x2="1580" y2="380" stroke="#444" stroke-width="2"/>

  <!-- Faixa de trânsito (pontilhada) -->
  <g stroke="#ffff00" stroke-width="3" stroke-dasharray="20,20" opacity="0.6">
    <line x1="0" y1="420" x2="1580" y2="420"/>
  </g>

  <!-- GRAFFITI ESTILO CARTOON COM PIXES -->

  <!-- Pixação grande "FOZ" em estilo wildstyle -->
  <g font-family="Arial, sans-serif" font-size="140" font-weight="900" fill="none" stroke-width="3" filter="url(#glow)">
    <!-- Contorno vermelho -->
    <text x="80" y="280" stroke="#ff2d5a" fill="none">FOZ</text>
    <!-- Preenchimento neon pink -->
    <text x="80" y="280" fill="#ff2d5a" opacity="0.9">FOZ</text>
  </g>

  <!-- Tag em azul neon -->
  <g font-family="Arial Black, sans-serif" font-size="120" font-weight="bold" fill="#00d9ff" opacity="0.8" filter="url(#glow)">
    <text x="1100" y="120" transform="rotate(-15 1100 120)" stroke="#00d9ff" stroke-width="2" fill="#00d9ff">STREET</text>
  </g>

  <!-- Pichação menor em amarelo -->
  <g font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffff00" opacity="0.7">
    <text x="700" y="100" transform="rotate(8 700 100)" stroke="#ff8800" stroke-width="1">BONETI</text>
  </g>

  <!-- Scribble/tag style em canto -->
  <path d="M 150 150 Q 200 120 250 150 T 350 160" stroke="#00ff88" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 140 170 Q 190 160 240 180" stroke="#00ff88" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Bolinhas/pontos decorativos (bubble style) -->
  <g fill="none" stroke-width="3">
    <circle cx="400" cy="200" r="25" stroke="#ffaa00" opacity="0.7"/>
    <circle cx="430" cy="220" r="20" stroke="#ffaa00" opacity="0.5"/>
    <circle cx="1400" cy="300" r="30" stroke="#00d9ff" opacity="0.6"/>
    <circle cx="1440" cy="330" r="22" stroke="#00d9ff" opacity="0.4"/>
  </g>

  <!-- Setas de graffiti -->
  <g stroke="#ff00ff" stroke-width="4" fill="none" opacity="0.6">
    <path d="M 500 120 L 550 120 L 540 110 M 550 120 L 540 130"/>
    <path d="M 1250 400 L 1200 400 L 1210 390 M 1200 400 L 1210 410"/>
  </g>

  <!-- Mais tags espalhadas -->
  <g font-family="Comic Sans MS, cursive" font-size="60" font-weight="bold" opacity="0.7">
    <text x="300" y="380" fill="#00ff88" transform="rotate(-20 300 380)">CREW</text>
    <text x="1350" y="200" fill="#ffaa00" transform="rotate(15 1350 200)">ART</text>
  </g>

  <!-- Spray paint drips -->
  <g fill="#ff2d5a" opacity="0.5">
    <ellipse cx="520" cy="160" rx="8" ry="15"/>
    <ellipse cx="1320" cy="130" rx="6" ry="12"/>
  </g>

  <!-- Efeito de hachura/linha de spray -->
  <g stroke="#00ff88" stroke-width="2" opacity="0.3">
    <line x1="100" y1="330" x2="150" y2="350"/>
    <line x1="120" y1="320" x2="170" y2="340"/>
    <line x1="140" y1="325" x2="190" y2="345"/>
  </g>

  <!-- Elementos aleatórios de pichação -->
  <g fill="#00d9ff" opacity="0.6">
    <polygon points="600,100 610,90 620,100 615,115"/>
    <polygon points="1150,350 1165,340 1180,350 1170,365"/>
  </g>

  <!-- Névoa/efeito de spray no fundo -->
  <ellipse cx="400" cy="250" rx="150" ry="100" fill="#ff00ff" opacity="0.05"/>
  <ellipse cx="1200" cy="300" rx="180" ry="120" fill="#00d9ff" opacity="0.05"/>

  <!-- Camada escura por cima para deixar fosco -->
  <rect width="1580" height="470" fill="#000000" opacity="0.45"/>
</svg>
